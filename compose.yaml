services:
  db:
    image: postgres:16-alpine
    environment:
      POSTGRES_DB: skillspace
      POSTGRES_USER: skillspace
      POSTGRES_PASSWORD: skillspace_dev
    ports:
      - "5432:5432"
    volumes:
      - skillspace-postgres-data:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U skillspace -d skillspace"]
      interval: 5s
      timeout: 3s
      retries: 10

  redis:
    image: redis:7-alpine
    command: ["redis-server", "--save", "", "--appendonly", "no"]
    ports:
      - "6379:6379"
    healthcheck:
      test: ["CMD", "redis-cli", "ping"]
      interval: 5s
      timeout: 3s
      retries: 10

  test-db:
    image: postgres:16-alpine
    profiles: ["integration"]
    environment:
      POSTGRES_DB: skillspace_test
      POSTGRES_USER: skillspace
      POSTGRES_PASSWORD: skillspace_dev
    ports:
      - "5433:5432"
    tmpfs:
      - /var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U skillspace -d skillspace_test"]
      interval: 5s
      timeout: 3s
      retries: 10

  test-redis:
    image: redis:7-alpine
    profiles: ["integration"]
    command: ["redis-server", "--save", "", "--appendonly", "no"]
    ports:
      - "6381:6379"
    tmpfs:
      - /data
    healthcheck:
      test: ["CMD", "redis-cli", "ping"]
      interval: 5s
      timeout: 3s
      retries: 10

  k6:
    image: grafana/k6:latest
    profiles: ["loadtest"]
    environment:
      BASE_URL: ${BASE_URL:-http://host.docker.internal:3000}
      TARGET_RPS: ${TARGET_RPS:-25}
      ALLOW_REMOTE_TARGET: "false"
    volumes:
      - ./load:/scripts:ro
    command: ["run", "/scripts/catalog.js"]

volumes:
  skillspace-postgres-data:
